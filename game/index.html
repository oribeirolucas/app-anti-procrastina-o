<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#12151d" />
    <meta name="description" content="Street — Jogo de Embaixadinhas. Mantenha a bola no ar enquanto percorre a rua." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23171a21'/%3E%3C/svg%3E" />
    <title>STREET · Jogo de Embaixadinhas</title>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>

      <!-- HUD (§9) -->
      <div id="hud" class="layer hidden">
        <div class="hud-top">
          <div class="hud-block">
            <span class="hud-label">PONTOS</span>
            <span class="hud-value" id="hud-score">0</span>
          </div>
          <div class="hud-block right">
            <span class="hud-label">RECORDE</span>
            <span class="hud-value dim" id="hud-record">0</span>
          </div>
        </div>
        <div class="hud-mid">
          <div class="hud-chip"><span id="hud-distance">0m</span></div>
          <div class="hud-chip" id="hud-tier">AQUECIMENTO</div>
        </div>
        <div class="hud-combo">
          <div class="combo-row">
            <span class="combo-streak" id="hud-streak">0</span>
            <span class="combo-mult" id="hud-mult">x1</span>
          </div>
          <div class="combo-bar"><div class="combo-fill" id="hud-combo-fill"></div></div>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="toast" id="toast"></div>
      </div>

      <!-- Menu (§14) -->
      <div id="menu" class="layer screen hidden">
        <div class="brand">
          <h1>STREET</h1>
          <p class="tagline">JOGO DE EMBAIXADINHAS</p>
        </div>
        <div class="menu-record" id="menu-record"></div>
        <div class="menu-buttons">
          <button class="btn primary" id="btn-play">JOGAR</button>
          <button class="btn" id="btn-characters">JOGADORES</button>
          <button class="btn ghost" id="btn-challenges" disabled>DESAFIOS <span class="soon">EM BREVE</span></button>
          <button class="btn ghost" id="btn-ranking" disabled>RANKING <span class="soon">EM BREVE</span></button>
          <button class="btn ghost" id="btn-custom" disabled>PERSONALIZAÇÃO <span class="soon">EM BREVE</span></button>
          <button class="btn small" id="btn-sound">SOM: LIGADO</button>
        </div>
      </div>

      <!-- Seleção de personagem (§12) -->
      <div id="characters" class="layer screen hidden">
        <h2 class="screen-title">ESCOLHA SEU CRAQUE</h2>
        <div class="char-grid" id="char-grid"></div>
        <div class="screen-actions">
          <button class="btn primary" id="btn-char-play">JOGAR AGORA</button>
          <button class="btn small" id="btn-char-back">VOLTAR</button>
        </div>
      </div>

      <!-- Tutorial (§15) -->
      <div id="tutorial" class="layer overlay hidden">
        <div class="tut-card">
          <ol class="tut-steps">
            <li><b>TOQUE NA TELA</b><span>para dar a embaixadinha</span></li>
            <li><b>MANTENHA A BOLA NO AR</b><span>acerte quando o anel fechar</span></li>
            <li><b>ARRASTE ↑ ← →</b><span>para corrigir a trajetória</span></li>
            <li><b>NÃO DEIXE A BOLA CAIR</b><span>vá o mais longe possível</span></li>
          </ol>
          <button class="btn primary" id="btn-tut-start">BORA</button>
        </div>
      </div>

      <!-- Game Over (§11) -->
      <div id="gameover" class="layer screen hidden">
        <h2 class="go-title">BOLA NO CHÃO!</h2>
        <div class="go-stats" id="go-stats"></div>
        <div class="screen-actions">
          <button class="btn primary big" id="btn-retry">TENTAR NOVAMENTE</button>
          <button class="btn" id="btn-go-characters">ESCOLHER JOGADOR</button>
          <button class="btn small" id="btn-go-menu">MENU</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
